services:
  geoserver:
    image: docker.osgeo.org/geoserver:2.28.0
    container_name: geoserver
    restart: unless-stopped
    labels:
      # Unraid specific
      net.unraid.docker.icon: "https://raw.githubusercontent.com/geoserver/geoserver/refs/heads/main/doc/themes/geoserver/static/geoserver.ico"
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]/geoserver/"
      net.unraid.docker.shell: "bash" # console shell (sh/bash)
      net.unraid.docker.managed: "composeman" # usually auto-set by the plugin
    ports:
      - "8080:8080"
    environment:
      SKIP_DEMO_DATA: "true"
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      ROOT_WEBAPP_REDIRECT: "true"
    volumes:
      - ./data:/opt/geoserver_data/:Z
